<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  body, html { margin: 0; font-family: -apple-system, sans-serif; background: #fff; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  #wrapper { width: 800px; height: 600px; position: relative; transform-origin: center center; flex-shrink: 0; }
  
  .toolbar-bg { position: absolute; top: 60px; left: 50px; width: 700px; height: 88px; background: #fff; border: 2px solid #e2e8f0; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); z-index: 10; box-sizing: border-box;}
  .brand { position: absolute; top: 82px; left: 82px; font-size: 32px; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 16px; z-index: 20;}
  .brand-icon { width: 44px; height: 44px; background: #2563eb; border-radius: 10px; }
  
  .btn-md { position: absolute; top: 78px; left: 400px; width: 200px; height: 52px; box-sizing: border-box; background: #2563eb; border: 2px solid #2563eb; color: #fff; border-radius: 12px; font-weight: 600; font-size: 20px; transition: 0.1s; z-index: 20; display: flex; align-items: center; justify-content: center;}
  .btn-settings { position: absolute; top: 78px; left: 620px; width: 100px; height: 52px; box-sizing: border-box; background: #fff; border: 2px solid #cbd5e1; color: #0f172a; border-radius: 12px; font-weight: 600; font-size: 20px; z-index: 20; display: flex; align-items: center; justify-content: center;}
  
  .stage { position: absolute; top: 240px; left: 220px; width: 400px; height: 160px; z-index: 5; }
  
  /* Vertical Stack Mini-Docs (Centered to the file-icon's coordinates) */
  .mini-doc { position: absolute; left: 5px; top: 47px; width: 44px; height: 66px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; box-shadow: 0 4px 12px rgba(15,23,42,0.1); z-index: 12; opacity: 0; }
  .mini-pdf { border: 2px solid #dc2626; color: #dc2626; }
  .mini-doc-file { border: 2px solid #2563eb; color: #2563eb; }
  .mini-txt { border: 2px solid #15803d; color: #15803d; } /* Updated CC to TXT */

  /* Main File Icon */
  .file-icon { width: 110px; height: 150px; border-radius: 12px; position: absolute; left: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 28px; opacity: 0; z-index: 15; }
  .f-html, .f-md { position: absolute; }
  
  /* AI Icon Box */
  .ai-icon { width: 140px; height: 140px; border-radius: 24px; background: #f3f4f6; border: 4px dashed #94a3b8; position: absolute; right: 0; display: flex; align-items: center; justify-content: center; opacity: 0; z-index: 10;}
  .svg-icon { width: 72px; height: 72px; position: absolute; }
  
  .pill { position: absolute; bottom: 50px; left: 50px; width: 700px; box-sizing: border-box; padding: 16px 32px; border-radius: 999px; font-weight: bold; color: #fff; font-size: 24px; z-index: 999; box-shadow: 0 8px 24px rgba(37,99,235,0.3); text-align: center; white-space: nowrap; background: #2563eb;}
  
  .cursor { position: absolute; width: 36px; height: 54px; z-index: 1000; top: 0; left: 0; transform: translate(750px, 550px); }
  .cursor svg { transform: scale(1); }

  /* --- Synchronized CSS Master Clock (6s Loop) --- */
  
  @keyframes cursorAnim { 0% { transform: translate(750px, 550px); } 20%, 80% { transform: translate(580px, 115px); } 100% { transform: translate(750px, 550px); } }
  @keyframes clickAnim { 0%, 23%, 28%, 100% { transform: scale(1); } 25% { transform: scale(0.85); } }
  
  @keyframes mdBtnColor { 0%, 24.9% { background: #2563eb; border-color: #2563eb; color: #fff; } 25%, 89.9% { background: #15803d; border-color: #15803d; color: #fff; } 90%, 100% { background: #2563eb; border-color: #2563eb; color: #fff; } }
  
  /* Fluid, slower vacuum sequence for the mini docs */
  @keyframes mPdf {
      0%, 5% { opacity: 0; transform: translate(-195px, -75px); }
      12%, 25% { opacity: 1; transform: translate(-90px, -75px) scale(1); animation-timing-function: cubic-bezier(0.5, 0, 0.2, 1); }
      33% { opacity: 0; transform: translate(0px, 0px) scale(0); }
      34%, 100% { opacity: 0; transform: translate(0,0) scale(0); }
  }
  @keyframes mDoc {
      0%, 5% { opacity: 0; transform: translate(-195px, 0px); }
      12%, 25% { opacity: 1; transform: translate(-90px, 0px) scale(1); animation-timing-function: cubic-bezier(0.5, 0, 0.2, 1); }
      33% { opacity: 0; transform: translate(0px, 0px) scale(0); }
      34%, 100% { opacity: 0; transform: translate(0,0) scale(0); }
  }
  @keyframes mTxt {
      0%, 5% { opacity: 0; transform: translate(-195px, 75px); }
      12%, 25% { opacity: 1; transform: translate(-90px, 75px) scale(1); animation-timing-function: cubic-bezier(0.5, 0, 0.2, 1); }
      33% { opacity: 0; transform: translate(0px, 0px) scale(0); }
      34%, 100% { opacity: 0; transform: translate(0,0) scale(0); }
  }

  /* Glitch-free Morphing File Icon */
  @keyframes fileAnim { 
      0%, 5% { opacity: 0; transform: translateX(0) scale(0.9); background: #f8fafc; border: 4px solid #cbd5e1; } 
      12%, 32% { opacity: 1; transform: translateX(0) scale(1); background: #f8fafc; border: 4px solid #cbd5e1; animation-timing-function: ease-out; } 
      34% { opacity: 1; transform: translateX(0) scale(1.05); background: #f8fafc; border: 4px solid #cbd5e1; animation-timing-function: ease-in-out;} /* Swell exactly when docs hit */
      39% { opacity: 1; transform: translateX(0) scale(1); background: #0f172a; border: 4px solid #0f172a; } /* Smooth morph */
      45% { opacity: 1; transform: translateX(0) scale(1); background: #0f172a; border: 4px solid #0f172a; animation-timing-function: ease-in-out;} 
      55% { opacity: 1; transform: translateX(230px) scale(0.6); background: #0f172a; border: 4px solid #0f172a; } 
      60%, 100% { opacity: 0; transform: translateX(230px) scale(0.3); background: #0f172a; border: 4px solid #0f172a; } 
  }
  
  /* Text Crossfades */
  @keyframes fHtmlAnim { 
      0%, 32% { opacity: 1; color: #64748b; transform: scale(1); } 
      38%, 100% { opacity: 0; color: #64748b; transform: scale(0.8); } 
  }
  @keyframes fMdAnim { 
      0%, 32% { opacity: 0; color: #fff; transform: scale(0.8); } 
      38%, 55% { opacity: 1; color: #fff; transform: scale(1); } 
      60%, 100% { opacity: 0; } 
  }
  
  /* AI Icon Pop Effect */
  @keyframes aiAnim { 
      0%, 24.9% { opacity: 0; transform: scale(0.8); background: #f3f4f6; border-color: #94a3b8; } 
      25%, 59% { opacity: 1; transform: scale(1); background: #f3f4f6; border-color: #94a3b8; animation-timing-function: ease-out;} 
      60% { opacity: 1; transform: scale(1.05); background: #2563eb; border-color: #2563eb; animation-timing-function: ease-in-out;} /* Pop on absorb */
      64%, 89.9% { opacity: 1; transform: scale(1); background: #2563eb; border-color: #2563eb; } 
      90%, 100% { opacity: 0; transform: scale(0.8); background: #2563eb; border-color: #2563eb; } 
  }
  
  @keyframes sparkleAnim { 0%, 58% { opacity: 1; color: #64748b; transform: scale(1); } 62%, 100% { opacity: 0; color: #64748b; transform: scale(0.5); } }
  @keyframes brainAnim { 0%, 59% { opacity: 0; color: #fff; transform: scale(0.5); } 64%, 100% { opacity: 1; color: #fff; transform: scale(1); } }
  @keyframes pillColor { 0%, 59.9% { background: #2563eb; } 60%, 89.9% { background: #15803d; } 90%, 100% { background: #2563eb; } }

  /* Body Sync Application */
  body.sync .cursor { animation: cursorAnim 6s infinite ease-in-out; } 
  body.sync .cursor svg { animation: clickAnim 6s infinite; }
  body.sync .btn-md { animation: mdBtnColor 6s infinite; }
  
  body.sync .mini-pdf { animation: mPdf 6s infinite; }
  body.sync .mini-doc-file { animation: mDoc 6s infinite; }
  body.sync .mini-txt { animation: mTxt 6s infinite; }
  
  body.sync .file-icon { animation: fileAnim 6s infinite; } 
  body.sync .f-html { animation: fHtmlAnim 6s infinite; }
  body.sync .f-md { animation: fMdAnim 6s infinite; }
  
  body.sync .ai-icon { animation: aiAnim 6s infinite; }
  body.sync .svg-sparkle { animation: sparkleAnim 6s infinite; }
  body.sync .svg-brain { animation: brainAnim 6s infinite; }
  body.sync .pill { animation: pillColor 6s infinite; }
</style>
</head>
<body>
  <div id="wrapper">
    <div class="toolbar-bg"></div>
    <div class="brand"><div class="brand-icon"></div> Your library</div>
    <div class="btn-md">Markdown for AI</div>
    <div class="btn-settings">Settings</div>
    
    <div class="stage">
        <!-- The Vertical Stack of Mini-Docs -->
        <div class="mini-doc mini-pdf">PDF</div>
        <div class="mini-doc mini-doc-file">DOC</div>
        <div class="mini-doc mini-txt">TXT</div>
        
        <!-- The Main File Icon -->
        <div class="file-icon">
            <span class="f-html">HTML</span>
            <span class="f-md">.md</span>
        </div>
        
        <!-- The AI Brain Box -->
        <div class="ai-icon">
          <svg class="svg-icon svg-sparkle" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
          <svg class="svg-icon svg-brain" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
        </div>
    </div>

    <div class="pill">One file. Paste it straight into your own AI.</div>
    <div class="cursor"><svg viewBox="0 0 24 36" fill="none"><path d="M0 0L0 25.4L7 19.3L11.4 28L15.9 26L11.5 17.5L19.7 17.5L0 0Z" fill="#0f172a" stroke="white" stroke-width="1.5"/></svg></div>
  </div>
  
  <script>
    function resize() { document.getElementById('wrapper').style.transform = `scale(${Math.min(window.innerWidth / 800, window.innerHeight / 600)})`; }
    window.addEventListener('resize', resize); resize();
    
    // Master Clock Trigger
    window.addEventListener('load', () => { document.body.classList.add('sync'); });
  </script>
</body>
</html>
