<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: #fff; overflow: hidden; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  
  #wrapper { width: 800px; height: 600px; position: relative; transform-origin: center center; flex-shrink: 0; }
  
  .toolbar-bg { position: absolute; top: 60px; left: 50px; width: 700px; height: 88px; background: #fff; border: 2px solid #e2e8f0; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); z-index: 10; box-sizing: border-box;}
  
  .brand { position: absolute; top: 82px; left: 82px; font-size: 32px; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 16px; z-index: 20;}
  .brand-icon { width: 44px; height: 44px; background: #2563eb; border-radius: 10px; }
  
  .btn-md { position: absolute; top: 78px; left: 400px; width: 200px; height: 52px; box-sizing: border-box; background: #2563eb; border: 2px solid #2563eb; color: #fff; border-radius: 12px; font-weight: 600; font-size: 20px; transition: 0.1s; z-index: 20; display: flex; align-items: center; justify-content: center;}
  
  .btn-settings { position: absolute; top: 78px; left: 620px; width: 100px; height: 52px; box-sizing: border-box; background: #fff; border: 2px solid #cbd5e1; color: #0f172a; border-radius: 12px; font-weight: 600; font-size: 20px; z-index: 20; display: flex; align-items: center; justify-content: center;}
  
  .stage { position: absolute; top: 240px; left: 200px; width: 400px; height: 160px; z-index: 5; }
  
  .file-icon { width: 110px; height: 150px; background: #f8fafc; border: 4px solid #cbd5e1; border-radius: 12px; position: absolute; left: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #64748b; font-size: 28px; opacity: 0; transition: 0.4s; }
  
  .ai-icon { width: 140px; height: 140px; border-radius: 24px; background: #f3f4f6; border: 4px dashed #94a3b8; position: absolute; right: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.4s; z-index: 10;}
  .svg-sparkle { width: 72px; height: 72px; color: #64748b; position: absolute; transition: 0.3s;}
  .svg-brain { width: 72px; height: 72px; color: #fff; position: absolute; opacity: 0; transition: 0.3s;}
  
  .pill { position: absolute; bottom: 50px; left: 50px; width: 700px; box-sizing: border-box; padding: 16px 32px; border-radius: 999px; font-weight: bold; color: #fff; font-size: 24px; background: #2563eb; transition: 0.3s; z-index: 999; box-shadow: 0 8px 24px rgba(37,99,235,0.3); text-align: center; white-space: nowrap; }
  
  .cursor { position: absolute; width: 36px; height: 54px; z-index: 1000; top: 0; left: 0; transform: translate(750px, 550px); }

  @keyframes cursorAnim { 0% { transform: translate(750px, 550px); } 20%, 80% { transform: translate(580px, 120px); } 100% { transform: translate(750px, 550px); } }
  @keyframes clickAnim { 0%, 23%, 28%, 100% { transform: scale(1); } 25% { transform: scale(0.85); } }

  .cursor { animation: cursorAnim 6s infinite ease-in-out; } .cursor svg { animation: clickAnim 6s infinite; }
</style>
</head>
<body>
  <div id="wrapper">
    <div class="toolbar-bg"></div>
    <div class="brand"><div class="brand-icon"></div> Your library</div>
    <div class="btn-md" id="mdBtn">Markdown for AI</div>
    <div class="btn-settings">Settings</div>
    
    <div class="stage">
        <div class="file-icon" id="fileIcon">HTML</div>
        <div class="ai-icon" id="aiIcon">
          <svg class="svg-sparkle" id="svgSparkle" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
          <svg class="svg-brain" id="svgBrain" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
        </div>
    </div>

    <div class="pill" id="pill">One file. Paste it straight into your AI model.</div>
    
    <div class="cursor"><svg viewBox="0 0 24 36" fill="none"><path d="M0 0L0 25.4L7 19.3L11.4 28L15.9 26L11.5 17.5L19.7 17.5L0 0Z" fill="#0f172a" stroke="white" stroke-width="1.5"/></svg></div>
  </div>
  
  <script>
    function resize() { 
        const scale = Math.min(window.innerWidth / 800, window.innerHeight / 600);
        document.getElementById('wrapper').style.transform = `scale(${scale})`; 
    }
    window.addEventListener('resize', resize); resize();

    const mdBtn = document.getElementById('mdBtn'); const file = document.getElementById('fileIcon'); const ai = document.getElementById('aiIcon'); const pill = document.getElementById('pill'); const sparkle = document.getElementById('svgSparkle'); const brain = document.getElementById('svgBrain');
    
    setInterval(() => {
        setTimeout(() => { 
            mdBtn.style.background = "#15803d"; mdBtn.style.borderColor = "#15803d";
            file.style.opacity = "1"; file.style.transform = "translateX(0)"; file.innerText = "HTML"; file.style.background = "#f8fafc"; file.style.color = "#64748b"; file.style.borderColor = "#cbd5e1";
            ai.style.opacity = "1"; ai.style.transform = "scale(1)"; ai.style.background = "#f3f4f6"; ai.style.borderColor = "#94a3b8"; sparkle.style.color = "#64748b";
        }, 1500); 
        
        setTimeout(() => { 
            file.style.background = "#0f172a"; file.style.color = "#fff"; file.style.borderColor = "#0f172a"; file.innerText = ".md";
        }, 2200); 
        
        setTimeout(() => { file.style.transform = "translateX(240px) scale(0.6)"; file.style.zIndex = "20"; }, 3200); 
        
        setTimeout(() => { 
            file.style.opacity = "0"; 
            ai.style.background = "#2563eb"; ai.style.borderColor = "#2563eb"; sparkle.style.opacity = "0"; brain.style.opacity = "1";
            pill.style.background = "#15803d";
        }, 3600); 
        
        setTimeout(() => { 
            mdBtn.style.background = "#2563eb"; mdBtn.style.borderColor = "#2563eb";
            file.style.opacity = "0"; file.style.transform = "translateX(0) scale(1)"; 
            ai.style.opacity = "0"; ai.style.transform = "scale(0.8)";
            pill.style.background = "#2563eb";
        }, 5400); 
    }, 6000);
  </script>
</body>
</html>
