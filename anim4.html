<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body, html { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: #fff; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;}
  #wrapper { width: 800px; height: 600px; position: relative; transform-origin: center center; flex-shrink: 0; }
  
  /* Panel aligned with anim2 (Top: 60, Height: 220) */
  .card { position: absolute; top: 60px; left: 100px; width: 600px; height: 220px; box-sizing: border-box; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); z-index: 10;}
  
  .list-item { position: absolute; top: 24px; left: 32px; width: 536px; box-sizing: border-box; border: 2px solid #15803d; background: #f0fdf4; border-radius: 12px; padding: 14px 20px; display: flex; align-items: center; gap: 16px; z-index: 20;}
  .checkbox { width: 24px; height: 24px; background: #15803d; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: white;}
  
  .btn-blue { position: absolute; top: 100px; left: 32px; width: 180px; height: 48px; box-sizing: border-box; border-radius: 12px; font-weight: 600; font-size: 20px; display: flex; align-items: center; justify-content: center; z-index: 20; background: #2563eb; color: #fff;}
  
  .progress { position: absolute; top: 168px; left: 32px; width: 536px; opacity: 0; z-index: 20;}
  .track { height: 12px; background: #cbd5e1; border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; background: #2563eb; width: 0%; }
  .prog-text { font-size: 18px; color: #475569; margin-top: 10px; font-weight: 500; position: relative; height: 24px;}
  .text-listen, .text-done { position: absolute; top: 0; left: 0; width: 100%; }
  
  /* Transcription Stage & Spacing - Shifted lower to balance whitespace */
  .transcription-stage { position: absolute; top: 310px; left: 100px; width: 600px; height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; z-index: 5;}
  
  /* Organic Speech Waveform */
  .audio-wave { display: flex; gap: 4px; align-items: center; justify-content: center; height: 60px; opacity: 0; margin-top: 0px;}
  .bar { width: 5px; background: #2563eb; border-radius: 3px; height: 8px; }
  
  /* 5 distinct speech patterns */
  @keyframes talk1 { 0%, 100% { height: 8px; } 30% { height: 28px; } 70% { height: 16px; } }
  @keyframes talk2 { 0%, 100% { height: 12px; } 40% { height: 44px; } 80% { height: 20px; } }
  @keyframes talk3 { 0%, 100% { height: 10px; } 25% { height: 36px; } 75% { height: 56px; } }
  @keyframes talk4 { 0%, 100% { height: 16px; } 35% { height: 60px; } 85% { height: 24px; } }
  @keyframes talk5 { 0%, 100% { height: 14px; } 50% { height: 40px; } 90% { height: 12px; } }

  /* Live Text - Pushed slightly lower from the wave */
  .live-text { margin-top: 45px; font-size: 26px; font-weight: 700; color: #0f172a; display: flex; gap: 8px;}
  .live-text span { opacity: 0; }
  
  .pill { position: absolute; bottom: 40px; left: 100px; width: 600px; box-sizing: border-box; padding: 16px 32px; border-radius: 999px; font-weight: bold; color: #fff; font-size: 22px; z-index: 999; box-shadow: 0 8px 24px rgba(37,99,235,0.3); text-align: center; white-space: nowrap; background: #2563eb; }
  
  /* Cursor: Hits Bottom-Right of Button (X: 297, Y: 193) */
  .cursor { position: absolute; width: 36px; height: 54px; z-index: 1000; top: 0; left: 0; transform: translate(750px, 550px); }
  .cursor svg { transform: scale(1); }

  /* Master Clock 6s Keyframes */
  @keyframes cursorAnim { 0% { transform: translate(750px, 550px); } 15%, 25% { transform: translate(297px, 193px); } 35%, 80% { transform: translate(297px, 193px); } 100% { transform: translate(750px, 550px); } }
  @keyframes clickAnim { 0%, 23%, 28%, 100% { transform: scale(1); } 25% { transform: scale(0.85); } }
  
  @keyframes btnOp { 0%, 24.9% { opacity: 1; } 25%, 89.9% { opacity: 0.5; } 90%, 100% { opacity: 1; } }
  @keyframes progOp { 0%, 24.9% { opacity: 0; } 25%, 89.9% { opacity: 1; } 90%, 100% { opacity: 0; } }
  
  /* Smooth Progress Bar Fill */
  @keyframes fillW { 0%, 25% { width: 0%; } 60%, 89.9% { width: 100%; } 90%, 100% { width: 0%; } }
  
  @keyframes txtListen { 0%, 59.9% { opacity: 1; } 60%, 100% { opacity: 0; } }
  @keyframes txtDone { 0%, 59.9% { opacity: 0; } 60%, 100% { opacity: 1; } }
  @keyframes pillColor { 0%, 59.9% { background: #2563eb; } 60%, 89.9% { background: #15803d; } 90%, 100% { background: #2563eb; } }
  
  /* Transcription Stage Synchronized Keyframes */
  @keyframes waveOp { 0%, 24.9% { opacity: 0; transform: scaleY(0.5); } 25%, 59.9% { opacity: 1; transform: scaleY(1); } 60%, 100% { opacity: 0; transform: scaleY(0.5); } }
  
  @keyframes w1Anim { 0%, 28.9% { opacity: 0; transform: translateY(10px); } 29%, 89.9% { opacity: 1; transform: translateY(0); } 90%, 100% { opacity: 0; } }
  @keyframes w2Anim { 0%, 35.9% { opacity: 0; transform: translateY(10px); } 36%, 89.9% { opacity: 1; transform: translateY(0); } 90%, 100% { opacity: 0; } }
  @keyframes w3Anim { 0%, 42.9% { opacity: 0; transform: translateY(10px); } 43%, 89.9% { opacity: 1; transform: translateY(0); } 90%, 100% { opacity: 0; } }
  @keyframes w4Anim { 0%, 49.9% { opacity: 0; transform: translateY(10px); } 50%, 89.9% { opacity: 1; transform: translateY(0); } 90%, 100% { opacity: 0; } }
  @keyframes w5Anim { 0%, 56.9% { opacity: 0; transform: translateY(10px); } 57%, 89.9% { opacity: 1; transform: translateY(0); } 90%, 100% { opacity: 0; } }

  /* Body Sync Application */
  body.sync .cursor { animation: cursorAnim 6s infinite ease-in-out; } 
  body.sync .cursor svg { animation: clickAnim 6s infinite; }
  body.sync .btn-blue { animation: btnOp 6s infinite; }
  body.sync .progress { animation: progOp 6s infinite; }
  body.sync .fill { animation: fillW 6s infinite; }
  body.sync .text-listen { animation: txtListen 6s infinite; }
  body.sync .text-done { animation: txtDone 6s infinite; }
  body.sync .pill { animation: pillColor 6s infinite; }
  
  body.sync .audio-wave { animation: waveOp 6s infinite ease-in-out; }
  
  /* Apply drifting durations to make the speech pattern organic */
  body.sync .bar:nth-child(5n+1) { animation: talk1 0.6s infinite ease-in-out alternate; }
  body.sync .bar:nth-child(5n+2) { animation: talk2 0.9s infinite ease-in-out alternate; }
  body.sync .bar:nth-child(5n+3) { animation: talk3 0.7s infinite ease-in-out alternate; }
  body.sync .bar:nth-child(5n+4) { animation: talk4 0.8s infinite ease-in-out alternate; }
  body.sync .bar:nth-child(5n+5) { animation: talk5 1.0s infinite ease-in-out alternate; }
  
  body.sync .w1 { animation: w1Anim 6s infinite ease-out; }
  body.sync .w2 { animation: w2Anim 6s infinite ease-out; }
  body.sync .w3 { animation: w3Anim 6s infinite ease-out; }
  body.sync .w4 { animation: w4Anim 6s infinite ease-out; }
  body.sync .w5 { animation: w5Anim 6s infinite ease-out; }
</style>
</head>
<body>
  <div id="wrapper">
    <div class="card">
      <div class="list-item">
        <div class="checkbox">&#10003;</div>
        <div><b style="color: #0f172a; font-size: 22px;">Week 3 Lecture.mp4</b> <span style="color: #475569; font-size: 22px; margin-left: 8px;">(no captions)</span></div>
      </div>
      <div class="btn-blue">Make captions</div>
      <div class="progress">
        <div class="track"><div class="fill"></div></div>
        <div class="prog-text">
            <div class="text-listen">Listening to "Week 3 Lecture.mp4" (1 of 1)...</div>
            <div class="text-done"><span style="color:#15803d; font-weight:700;">&#10003; Finished.</span> Captions saved next to video.</div>
        </div>
      </div>
    </div>
    
    <div class="transcription-stage">
        <div class="audio-wave">
            <!-- 25 Bars for high-resolution waveform -->
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="live-text">
            <span class="w1">Slingshots</span>
            <span class="w2">use</span>
            <span class="w3">hyperbolic</span>
            <span class="w4">planetary</span>
            <span class="w5">trajectories.</span>
        </div>
    </div>

    <div class="pill">Runs on your computer. Nothing uploaded.</div>
    
    <div class="cursor"><svg viewBox="0 0 24 36" fill="none"><path d="M0 0L0 25.4L7 19.3L11.4 28L15.9 26L11.5 17.5L19.7 17.5L0 0Z" fill="#0f172a" stroke="white" stroke-width="1.5"/></svg></div>
  </div>
  
  <script>
    function resize() { document.getElementById('wrapper').style.transform = `scale(${Math.min(window.innerWidth / 800, window.innerHeight / 600)})`; }
    window.addEventListener('resize', resize); resize();
    
    // Master Clock Trigger
    window.addEventListener('load', () => { document.body.classList.add('sync'); });
  </script>
</body>
</html>
