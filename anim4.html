<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body, html { margin: 0; font-family: -apple-system, sans-serif; background: #fff; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;}
  #wrapper { width: 800px; height: 600px; position: relative; transform-origin: center center; flex-shrink: 0; }
  
  .card { position: absolute; top: 100px; left: 100px; width: 600px; height: 260px; box-sizing: border-box; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 16px; padding: 32px; box-shadow: 0 8px 24px rgba(15,23,42,0.05); z-index: 10;}
  .list-item { position: absolute; top: 32px; left: 32px; width: 532px; box-sizing: border-box; border: 2px solid #15803d; background: #f0fdf4; border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; z-index: 20;}
  .checkbox { width: 24px; height: 24px; background: #15803d; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: white;}
  .btn-blue { position: absolute; top: 135px; left: 32px; width: 180px; height: 50px; box-sizing: border-box; border-radius: 12px; font-weight: 600; font-size: 20px; display: flex; align-items: center; justify-content: center; z-index: 20; background: #2563eb; color: #fff;}
  
  .progress { position: absolute; top: 205px; left: 32px; width: 532px; z-index: 20; opacity: 0;}
  .track { height: 12px; background: #cbd5e1; border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; background: #2563eb; width: 0%; }
  .prog-text { font-size: 18px; color: #475569; margin-top: 12px; font-weight: 500; position: relative; height: 24px;}
  .text-listen, .text-done { position: absolute; top: 0; left: 0; width: 100%; }
  .text-listen { opacity: 1; } .text-done { opacity: 0; }
  
  .pill { position: absolute; bottom: 50px; left: 100px; width: 600px; box-sizing: border-box; padding: 16px 32px; border-radius: 999px; font-weight: bold; color: #fff; font-size: 22px; z-index: 999; box-shadow: 0 8px 24px rgba(37,99,235,0.3); text-align: center; white-space: nowrap; background: #2563eb; }
  
  .cursor { position: absolute; width: 36px; height: 54px; z-index: 1000; top: 0; left: 0; transform: translate(750px, 550px); }
  .cursor svg { transform: scale(1); }

  /* Synchronized Keyframes */
  @keyframes cursorAnim { 0% { transform: translate(750px, 550px); } 20%, 80% { transform: translate(295px, 275px); } 100% { transform: translate(750px, 550px); } }
  @keyframes clickAnim { 0%, 23%, 28%, 100% { transform: scale(1); } 25% { transform: scale(0.85); } }
  
  @keyframes btnOp { 0%, 24.9% { opacity: 1; } 25%, 89.9% { opacity: 0.5; } 90%, 100% { opacity: 1; } }
  @keyframes progOp { 0%, 24.9% { opacity: 0; } 25%, 89.9% { opacity: 1; } 90%, 100% { opacity: 0; } }
  @keyframes fillW { 0%, 24.9% { width: 0%; } 25% { width: 0%; transition: none; } 60%, 100% { width: 100%; transition: width 2.1s linear; } }
  @keyframes txtListen { 0%, 59.9% { opacity: 1; } 60%, 100% { opacity: 0; } }
  @keyframes txtDone { 0%, 59.9% { opacity: 0; } 60%, 100% { opacity: 1; } }
  @keyframes pillColor { 0%, 59.9% { background: #2563eb; } 60%, 89.9% { background: #15803d; } 90%, 100% { background: #2563eb; } }

  body.sync .cursor { animation: cursorAnim 6s infinite ease-in-out; } 
  body.sync .cursor svg { animation: clickAnim 6s infinite; }
  body.sync .btn-blue { animation: btnOp 6s infinite; }
  body.sync .progress { animation: progOp 6s infinite; }
  body.sync .fill { animation: fillW 6s infinite; }
  body.sync .text-listen { animation: txtListen 6s infinite; }
  body.sync .text-done { animation: txtDone 6s infinite; }
  body.sync .pill { animation: pillColor 6s infinite; }
</style>
</head>
<body>
  <div id="wrapper">
    <div class="card">
      <div class="list-item">
        <div class="checkbox">&#10003;</div>
        <div><b style="color: #0f172a; font-size: 22px;">Week 3 Lecture.mp4</b> <span style="color: #475569; font-size: 22px; margin-left: 8px;">(no captions)</span></div>
      </div>
      <div class="btn-blue">Make captions</div>
      <div class="progress">
        <div class="track"><div class="fill"></div></div>
        <div class="prog-text">
            <div class="text-listen">Listening to "Week 3 Lecture.mp4" (1 of 1)...</div>
            <div class="text-done"><span style="color:#15803d; font-weight:700;">&#10003; Finished.</span> Captions saved next to video.</div>
        </div>
      </div>
    </div>
    <div class="pill">Runs on your computer. Nothing uploaded.</div>
    <div class="cursor"><svg viewBox="0 0 24 36" fill="none"><path d="M0 0L0 25.4L7 19.3L11.4 28L15.9 26L11.5 17.5L19.7 17.5L0 0Z" fill="#0f172a" stroke="white" stroke-width="1.5"/></svg></div>
  </div>
  <script>
    function resize() { document.getElementById('wrapper').style.transform = `scale(${Math.min(window.innerWidth / 800, window.innerHeight / 600)})`; }
    window.addEventListener('resize', resize); resize();
    window.addEventListener('load', () => { document.body.classList.add('sync'); });
  </script>
</body>
</html>
