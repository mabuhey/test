<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: #fff; overflow: hidden; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;}
  
  #wrapper { width: 800px; height: 600px; position: relative; transform-origin: center center; flex-shrink: 0; }
  
  .card { position: absolute; top: 100px; left: 100px; width: 600px; height: 260px; box-sizing: border-box; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 16px; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); z-index: 10;}
  
  .list-item { position: absolute; top: 32px; left: 32px; width: 532px; box-sizing: border-box; border: 2px solid #15803d; background: #f0fdf4; border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; z-index: 20;}
  .checkbox { width: 24px; height: 24px; background: #15803d; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: white;}
  
  .btn-blue { position: absolute; top: 135px; left: 32px; width: 180px; height: 50px; box-sizing: border-box; background: #2563eb; color: #fff; border-radius: 12px; font-weight: 600; font-size: 20px; display: flex; align-items: center; justify-content: center; z-index: 20; transition: 0.1s;}
  
  .progress { position: absolute; top: 205px; left: 32px; width: 532px; opacity: 0; transition: 0.1s; z-index: 20;}
  .track { height: 12px; background: #cbd5e1; border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; width: 0%; background: #2563eb; transition: width 2s linear; }
  .prog-text { font-size: 18px; color: #475569; margin-top: 12px; font-weight: 500;}
  
  .pill { position: absolute; bottom: 50px; left: 100px; width: 600px; box-sizing: border-box; padding: 16px 32px; border-radius: 999px; font-weight: bold; color: #fff; font-size: 22px; background: #2563eb; transition: 0.3s; z-index: 999; box-shadow: 0 8px 24px rgba(37,99,235,0.3); text-align: center; white-space: nowrap; }
  
  /* Target: 295, 275 */
  .cursor { position: absolute; width: 36px; height: 54px; z-index: 1000; top: 0; left: 0; transform: translate(750px, 550px); }

  @keyframes cursorAnim { 0% { transform: translate(750px, 550px); } 20%, 80% { transform: translate(295px, 275px); } 100% { transform: translate(750px, 550px); } }
  @keyframes clickAnim { 0%, 23%, 28%, 100% { transform: scale(1); } 25% { transform: scale(0.85); } }

  .cursor { animation: cursorAnim 6s infinite ease-in-out; } .cursor svg { animation: clickAnim 6s infinite; }
</style>
</head>
<body>
  <div id="wrapper">
    <div class="card">
      <div class="list-item">
        <div class="checkbox">&#10003;</div>
        <div><b style="color: #0f172a; font-size: 22px;">Week 3 Lecture.mp4</b> <span style="color: #475569; font-size: 22px; margin-left: 8px;">(no captions)</span></div>
      </div>
      
      <div class="btn-blue" id="capBtn">Make captions</div>
      
      <div class="progress" id="prog">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="prog-text" id="progText">Listening to "Week 3 Lecture.mp4" (1 of 1)...</div>
      </div>
    </div>

    <div class="pill" id="pill">Runs on your computer. Nothing uploaded.</div>
    
    <div class="cursor"><svg viewBox="0 0 24 36" fill="none"><path d="M0 0L0 25.4L7 19.3L11.4 28L15.9 26L11.5 17.5L19.7 17.5L0 0Z" fill="#0f172a" stroke="white" stroke-width="1.5"/></svg></div>
  </div>
  
  <script>
    function resize() { 
        const scale = Math.min(window.innerWidth / 800, window.innerHeight / 600);
        document.getElementById('wrapper').style.transform = `scale(${scale})`; 
    }
    window.addEventListener('resize', resize); resize();

    const capBtn = document.getElementById('capBtn'); const prog = document.getElementById('prog'); const fill = document.getElementById('fill'); const pill = document.getElementById('pill'); const progText = document.getElementById('progText');
    
    setInterval(() => {
        setTimeout(() => { 
            capBtn.style.opacity = "0.5"; 
            prog.style.opacity = "1";
            fill.style.width = "100%";
        }, 1500); 
        
        setTimeout(() => { 
            progText.innerHTML = "<span style='color:#15803d; font-weight:700;'>&#10003; Finished.</span> Captions saved next to video.";
            pill.style.background = "#15803d";
        }, 3600);
        
        setTimeout(() => { 
            capBtn.style.opacity = "1"; 
            prog.style.opacity = "0";
            fill.style.transition = "none"; fill.style.width = "0%";
            setTimeout(() => { fill.style.transition = "width 2s linear"; }, 100);
            progText.innerHTML = "Listening to \"Week 3 Lecture.mp4\" (1 of 1)...";
            pill.style.background = "#2563eb";
        }, 5400); 
    }, 6000);
  </script>
</body>
</html>
