<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: #fff; overflow: hidden; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  
  #wrapper { width: 800px; height: 600px; position: relative; transform-origin: center center; flex-shrink: 0;}

  .panel { position: absolute; top: 60px; left: 100px; width: 600px; height: 220px; box-sizing: border-box; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); background: #f8fafc; z-index: 10;}
  .title { position: absolute; top: 32px; left: 32px; font-size: 28px; font-weight: 700; color: #0f172a; }
  .checkbox { position: absolute; top: 100px; left: 32px; width: 32px; height: 32px; border: 3px solid #cbd5e1; border-radius: 6px; background: #fff; transition: 0.1s; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: white; z-index: 20;}
  .checkbox.checked { background: #2563eb; border-color: #2563eb; }
  .setting-text { position: absolute; top: 102px; left: 80px; color: #1e293b; font-size: 24px; }
  .btn-pdf { position: absolute; top: 156px; left: 32px; width: 190px; height: 56px; box-sizing: border-box; background: #2563eb; color: #fff; border-radius: 12px; font-weight: 600; font-size: 22px; display: flex; align-items: center; justify-content: center; z-index: 20; transition: 0.1s;}
  
  .icon-stage { position: absolute; top: 320px; left: 250px; width: 300px; height: 160px; display: flex; justify-content: center; align-items: center; z-index: 5; }
  .doc { width: 80px; height: 110px; background: #f8fafc; border: 3px solid #cbd5e1; border-radius: 8px; position: absolute; opacity: 0; transition: 0.4s; }
  .doc-pdf { width: 100px; height: 130px; background: #fff; border: 4px solid #dc2626; border-radius: 8px; position: absolute; z-index: 5; opacity: 0; transform: scale(0.8); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; justify-content: center; color: #dc2626; font-weight: 900; font-size: 28px;}
  
  .pill { position: absolute; bottom: 40px; left: 100px; width: 600px; box-sizing: border-box; padding: 16px 32px; border-radius: 999px; font-weight: bold; color: #fff; font-size: 22px; background: #2563eb; transition: 0.3s; z-index: 999; box-shadow: 0 8px 24px rgba(37,99,235,0.3); text-align: center; white-space: nowrap; }
  
  .cursor { position: absolute; width: 36px; height: 54px; z-index: 1000; top: 0; left: 0; transform: translate(750px, 550px); }

  @keyframes cursorAnim {
      0% { transform: translate(750px, 550px); }
      15%, 25% { transform: translate(154px, 182px); } /* Perfect Checkbox B-R */
      35%, 80% { transform: translate(302px, 260px); } /* Perfect Button B-R */
      100% { transform: translate(750px, 550px); }
  }
  @keyframes clickAnim { 0%, 18%, 22%, 38%, 42%, 100% { transform: scale(1); } 20%, 40% { transform: scale(0.85); } }
  
  .cursor { animation: cursorAnim 6s infinite ease-in-out; }
  .cursor svg { animation: clickAnim 6s infinite; }
</style>
</head>
<body>
  <div id="wrapper">
    <div class="panel">
      <div class="title">Quality Settings</div>
      <div class="checkbox" id="chk"></div>
      <div class="setting-text">Also make one PDF of the whole book</div>
      <div class="btn-pdf" id="btnPdf">Save as PDF</div>
    </div>

    <div class="icon-stage">
        <div class="doc" id="d1" style="transform: translate(-100px, -30px);"></div>
        <div class="doc" id="d2" style="transform: translate(100px, -15px);"></div>
        <div class="doc" id="d3" style="transform: translate(0px, 70px);"></div>
        <div class="doc-pdf" id="pdfIcon">PDF</div>
    </div>

    <div class="pill" id="pill">One PDF. Contents, bookmarks, page numbers.</div>
    
    <div class="cursor"><svg viewBox="0 0 24 36" fill="none"><path d="M0 0L0 25.4L7 19.3L11.4 28L15.9 26L11.5 17.5L19.7 17.5L0 0Z" fill="#0f172a" stroke="white" stroke-width="1.5"/></svg></div>
  </div>
  
  <script>
    function resize() { 
        const scale = Math.min(window.innerWidth / 800, window.innerHeight / 600);
        document.getElementById('wrapper').style.transform = `scale(${scale})`; 
    }
    window.addEventListener('resize', resize); resize();

    const chk = document.getElementById('chk'); const btnPdf = document.getElementById('btnPdf'); const d1 = document.getElementById('d1'); const d2 = document.getElementById('d2'); const d3 = document.getElementById('d3'); const pdf = document.getElementById('pdfIcon'); const pill = document.getElementById('pill');
    
    setInterval(() => {
        setTimeout(() => { 
            chk.classList.add('checked'); chk.innerHTML = "&#10003;"; 
        }, 1200); 
        
        setTimeout(() => { 
            btnPdf.style.background = "#15803d"; 
            d1.style.opacity = "1"; d2.style.opacity = "1"; d3.style.opacity = "1"; 
            d1.style.transform = "translate(0,0)"; d2.style.transform = "translate(0,0)"; d3.style.transform = "translate(0,0)";
        }, 2400); 
        
        setTimeout(() => { 
            d1.style.opacity = "0"; d2.style.opacity = "0"; d3.style.opacity = "0"; 
            pdf.style.opacity = "1"; pdf.style.transform = "scale(1.1)";
            pill.style.background = "#15803d";
        }, 2800);
        setTimeout(() => { pdf.style.transform = "scale(1)"; }, 3100);
        
        setTimeout(() => { 
            chk.classList.remove('checked'); chk.innerHTML = ""; btnPdf.style.background = "#2563eb";
            pdf.style.opacity = "0"; pdf.style.transform = "scale(0.8)";
            d1.style.transform = "translate(-100px, -30px)"; d2.style.transform = "translate(100px, -15px)"; d3.style.transform = "translate(0px, 70px)";
            pill.style.background = "#2563eb";
        }, 5400); 
    }, 6000);
  </script>
</body>
</html>
