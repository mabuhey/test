<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body, html { margin: 0; font-family: -apple-system, sans-serif; background: #fff; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  
  #wrapper { width: 800px; height: 600px; position: relative; transform-origin: center center; flex-shrink: 0;}

  .panel { position: absolute; top: 60px; left: 100px; width: 600px; height: 220px; box-sizing: border-box; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); background: #f8fafc; z-index: 10;}
  .title { position: absolute; top: 32px; left: 32px; font-size: 28px; font-weight: 700; color: #0f172a; }
  
  .checkbox { position: absolute; top: 100px; left: 32px; width: 32px; height: 32px; border: 3px solid #cbd5e1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: white; z-index: 20; background: #fff;}
  .checkbox::after { content: ""; }
  
  .setting-text { position: absolute; top: 102px; left: 80px; color: #1e293b; font-size: 24px; }
  .btn-pdf { position: absolute; top: 156px; left: 32px; width: 190px; height: 56px; box-sizing: border-box; border-radius: 12px; font-weight: 600; font-size: 22px; display: flex; align-items: center; justify-content: center; z-index: 20; background: #2563eb; color: #fff; }
  
  /* Stage centered mathematically at X:400, Y:380 to act as a black hole for the pages */
  .icon-stage { position: absolute; top: 380px; left: 400px; width: 0; height: 0; display: flex; justify-content: center; align-items: center; z-index: 5; }
  
  /* Flowing HTML Documents */
  .doc { width: 44px; height: 60px; background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 6px; position: absolute; display: flex; align-items: center; justify-content: center; color: #64748b; font-weight: 800; font-size: 11px; opacity: 0; box-shadow: 0 4px 12px rgba(15,23,42,0.05); }
  
  .doc-pdf { width: 100px; height: 130px; background: #fff; border: 4px solid #dc2626; border-radius: 8px; position: absolute; z-index: 5; opacity: 0; transform: scale(0.5); display: flex; align-items: center; justify-content: center; color: #dc2626; font-weight: 900; font-size: 28px;}
  
  .pill { position: absolute; bottom: 40px; left: 100px; width: 600px; box-sizing: border-box; padding: 16px 32px; border-radius: 999px; font-weight: bold; color: #fff; font-size: 22px; z-index: 999; box-shadow: 0 8px 24px rgba(37,99,235,0.3); text-align: center; white-space: nowrap; background: #2563eb; }
  
  .cursor { position: absolute; width: 36px; height: 54px; z-index: 1000; top: 0; left: 0; transform: translate(750px, 550px); }
  .cursor svg { transform: scale(1); }

  /* Synchronized Keyframes */
  @keyframes cursorAnim { 0% { transform: translate(750px, 550px); } 15%, 25% { transform: translate(154px, 182px); } 35%, 80% { transform: translate(302px, 260px); } 100% { transform: translate(750px, 550px); } }
  @keyframes clickAnim { 0%, 18%, 22%, 38%, 42%, 100% { transform: scale(1); } 20%, 40% { transform: scale(0.85); } }
  
  @keyframes checkBg { 0%, 19.9% { background: #fff; border-color: #cbd5e1; } 20%, 89.9% { background: #2563eb; border-color: #2563eb; } 90%, 100% { background: #fff; border-color: #cbd5e1; } }
  @keyframes checkMark { 0%, 19.9% { content: ""; } 20%, 89.9% { content: "\2713"; } 90%, 100% { content: ""; } }
  @keyframes btnBg { 0%, 39.9% { background: #2563eb; } 40%, 89.9% { background: #15803d; } 90%, 100% { background: #2563eb; } }
  
  /* Dual Highway Flow & Collapse Animations */
  @keyframes topFlow { 
      0% { opacity: 0; transform: translate(var(--sx), -45px) scale(1); animation-timing-function: linear; } 
      2%, 39% { opacity: 1; }
      40% { opacity: 1; transform: translate(var(--ex), -45px) scale(1); animation-timing-function: cubic-bezier(0.5, 0, 0.2, 1); } 
      46.7% { opacity: 1; transform: translate(0, 0) scale(0); } 
      46.8%, 100% { opacity: 0; transform: translate(0,0) scale(0); } 
  }
  @keyframes btmFlow { 
      0% { opacity: 0; transform: translate(var(--sx), 45px) scale(1); animation-timing-function: linear; } 
      2%, 39% { opacity: 1; }
      40% { opacity: 1; transform: translate(var(--ex), 45px) scale(1); animation-timing-function: cubic-bezier(0.5, 0, 0.2, 1); } 
      46.7% { opacity: 1; transform: translate(0, 0) scale(0); } 
      46.8%, 100% { opacity: 0; transform: translate(0,0) scale(0); } 
  }
  
  @keyframes pdfBadge { 0%, 46.6% { opacity: 0; transform: scale(0.5); } 46.7% { opacity: 0; transform: scale(0.5); animation-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275); } 48% { opacity: 1; } 51.7% { opacity: 1; transform: scale(1.1); animation-timing-function: ease-in-out; } 56.7%, 89.9% { opacity: 1; transform: scale(1); } 90%, 100% { opacity: 0; transform: scale(0.5); } }
  
  @keyframes pillColor { 0%, 46.5% { background: #2563eb; } 46.6%, 89.9% { background: #15803d; } 90%, 100% { background: #2563eb; } }

  /* Master Clock Links */
  body.sync .cursor { animation: cursorAnim 6s infinite ease-in-out; } 
  body.sync .cursor svg { animation: clickAnim 6s infinite; }
  body.sync .checkbox { animation: checkBg 6s infinite; } 
  body.sync .checkbox::after { animation: checkMark 6s infinite; }
  body.sync .btn-pdf { animation: btnBg 6s infinite; }
  
  body.sync .top-row { animation: topFlow 6s infinite; }
  body.sync .btm-row { animation: btmFlow 6s infinite; }
  
  body.sync .doc-pdf { animation: pdfBadge 6s infinite; }
  body.sync .pill { animation: pillColor 6s infinite; }
</style>
</head>
<body>
  <div id="wrapper">
    <div class="panel">
      <div class="title">Quality Settings</div>
      <div class="checkbox"></div>
      <div class="setting-text">Also make one PDF of the whole book</div>
      <div class="btn-pdf">Save as PDF</div>
    </div>

    <div class="icon-stage">
        <!-- Top Row (Flows Right) -->
        <div class="doc top-row" style="--sx: -450px; --ex: -150px;">HTML</div>
        <div class="doc top-row" style="--sx: -360px; --ex: -60px;">HTML</div>
        <div class="doc top-row" style="--sx: -270px; --ex: 30px;">HTML</div>
        <div class="doc top-row" style="--sx: -180px; --ex: 120px;">HTML</div>
        <div class="doc top-row" style="--sx: -90px; --ex: 210px;">HTML</div>
        <div class="doc top-row" style="--sx: 0px; --ex: 300px;">HTML</div>
        <div class="doc top-row" style="--sx: 90px; --ex: 390px;">HTML</div>
        <div class="doc top-row" style="--sx: 180px; --ex: 480px;">HTML</div>
        <div class="doc top-row" style="--sx: 270px; --ex: 570px;">HTML</div>
        <div class="doc top-row" style="--sx: 360px; --ex: 660px;">HTML</div>
        
        <!-- Bottom Row (Flows Left) -->
        <div class="doc btm-row" style="--sx: 450px; --ex: 150px;">HTML</div>
        <div class="doc btm-row" style="--sx: 360px; --ex: 60px;">HTML</div>
        <div class="doc btm-row" style="--sx: 270px; --ex: -30px;">HTML</div>
        <div class="doc btm-row" style="--sx: 180px; --ex: -120px;">HTML</div>
        <div class="doc btm-row" style="--sx: 90px; --ex: -210px;">HTML</div>
        <div class="doc btm-row" style="--sx: 0px; --ex: -300px;">HTML</div>
        <div class="doc btm-row" style="--sx: -90px; --ex: -390px;">HTML</div>
        <div class="doc btm-row" style="--sx: -180px; --ex: -480px;">HTML</div>
        <div class="doc btm-row" style="--sx: -270px; --ex: -570px;">HTML</div>
        <div class="doc btm-row" style="--sx: -360px; --ex: -660px;">HTML</div>

        <div class="doc-pdf">PDF</div>
    </div>

    <div class="pill">One PDF. Contents, bookmarks, page numbers.</div>
    <div class="cursor"><svg viewBox="0 0 24 36" fill="none"><path d="M0 0L0 25.4L7 19.3L11.4 28L15.9 26L11.5 17.5L19.7 17.5L0 0Z" fill="#0f172a" stroke="white" stroke-width="1.5"/></svg></div>
  </div>
  
  <script>
    function resize() { document.getElementById('wrapper').style.transform = `scale(${Math.min(window.innerWidth / 800, window.innerHeight / 600)})`; }
    window.addEventListener('resize', resize); resize();
    
    // Master Clock Trigger
    window.addEventListener('load', () => { document.body.classList.add('sync'); });
  </script>
</body>
</html>
